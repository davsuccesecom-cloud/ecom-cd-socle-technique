    <style>
      *, *::before, *::after {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      input, textarea, [contenteditable="true"], .select-text, .select-all, [data-allow-copy="true"] {
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
        user-select: text !important;
      }
      img, svg, a {

      }
    </style>
    <script>
      (function() {
        // Anti-Save As & Anti-Cloning Shield : neutralise toute copie locale sauvegardée ou domaine tiers
        var proto = window.location.protocol;
        var host = (window.location.hostname || '').toLowerCase();
        var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0';
        var isAuthorizedHost = isLocal || host.endsWith('.vercel.app') || host.endsWith('waritrack.com') || host.endsWith('waritrack.net');

        if (proto === 'file:' || proto === 'about:' || !isAuthorizedHost) {
          window.stop && window.stop();
          document.documentElement.innerHTML = '<head><meta charset="utf-8"><title>🔒 Copie non autorisée — WariTrack Security</title></head><body style="background:#07090F;margin:0;">' +
            '<div style="position:fixed;inset:0;background:#07090F;color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px;z-index:999999;">' +
            '<div style="width:56px;height:56px;border-radius:16px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">' +
            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
            '</div>' +
            '<h1 style="font-size:20px;font-weight:800;letter-spacing:-0.02em;color:#F87171;margin-bottom:8px;">COPIE LOCALE OU CLONE NON AUTORISÉ</h1>' +
            '<p style="font-size:13px;color:#94A3B8;max-width:440px;line-height:1.6;margin-bottom:24px;">Cette interface et son code sont protégés contre la copie et l\'usurpation. L\'exécution hors-ligne d\'une page sauvegardée (« Enregistrer sous ») ou sur un domaine tiers non autorisé est strictement verrouillée.</p>' +
            '<a href="https://ecom-cd-socle-technique-admin.vercel.app" style="background:#6366F1;color:#FFFFFF;padding:10px 22px;border-radius:12px;text-decoration:none;font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(99,102,241,0.4);">Accéder à la plateforme officielle</a>' +
            '</div></body>';
          throw new Error("WariTrack Security: Offline or unauthorized clone execution terminated.");
        }

        // Anti-Clickjacking
        try {
          if (window.top && window.top !== window.self) {
            window.top.location.href = window.self.location.href;
          }
        } catch(e) {}

        // Invalidation et purge des anciens caches de Service Worker
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var k of keys) {
              if (!k.includes('v4-lock')) {
                caches.delete(k);
              }
            }
          }).catch(function() {});
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            window.location.reload();
          });
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) { r.update(); }
          }).catch(function() {});
        }

        window.__isInputTarget = function(el) {
          if (!el) return false;
          var t = el.tagName;
          if (t === 'INPUT' || t === 'TEXTAREA' || el.isContentEditable) return true;
          return Boolean(el.closest && el.closest('input, textarea, [contenteditable="true"], .select-text, .select-all, [data-allow-copy="true"]'));
        };

        // Blocage natif de la sélection au curseur
        document.addEventListener('selectstart', function(e) {
          if (!window.__isInputTarget(e.target)) {
            e.preventDefault();
            return false;
          }
        }, true);

        // Blocage natif du clic droit
        document.addEventListener('contextmenu', function(e) {
          if (!window.__isInputTarget(e.target) && !(e.target.closest && e.target.closest('[data-allow-context="true"]'))) {
            e.preventDefault();
            return false;
          }
        }, true);

        // Blocage natif des raccourcis
        document.addEventListener('keydown', function(e) {
          var k = (e.key || '').toLowerCase();
          var ctrl = e.ctrlKey || e.metaKey;
          var inp = window.__isInputTarget(e.target);

          if (ctrl && (k === 's' || k === 'u' || k === 'p')) {
            e.preventDefault();
            return false;
          }
          if (k === 'f12' || (ctrl && e.shiftKey && (k === 'i' || k === 'j' || k === 'c'))) {
            e.preventDefault();
            return false;
          }
          if (ctrl && (k === 'a' || k === 'c' || k === 'x') && !inp) {
            e.preventDefault();
            return false;
          }
        }, true);

        // Blocage natif de copie avec empoisonnement du presse-papier
        document.addEventListener('copy', function(e) {
          if (!window.__isInputTarget(document.activeElement) && !window.__isInputTarget(e.target)) {
            e.preventDefault();
            if (e.clipboardData) {
              e.clipboardData.setData('text/plain', '🔒 Contenu protégé — WariTrack Security Shield (Copie interdite).');
            }
            return false;
          }
        }, true);

        // Blocage natif drag
        document.addEventListener('dragstart', function(e) {
          var t = e.target;
          if (t && (t.tagName === 'IMG' || t.tagName === 'SVG' || (t.closest && t.closest('svg, img, a')))) {
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <script>
      try {
        var t = localStorage.getItem("ecomcod-theme");
        var a = localStorage.getItem("ecomcod-accent") || "indigo";
        if (t === "light") {
          document.documentElement.classList.add("light");
        } else {
          document.documentElement.classList.add("dark");
        }
        document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>

  <body
    oncontextmenu="if (!window.__isInputTarget || !window.__isInputTarget(event.target)) { event.preventDefault(); return false; }"
    onselectstart="if (!window.__isInputTarget || !window.__isInputTarget(event.target)) { event.preventDefault(); return false; }"
    oncopy="if (!window.__isInputTarget || !window.__isInputTarget(event.target)) { event.preventDefault(); if (event.clipboardData) event.clipboardData.setData('text/plain', '🔒 Contenu protégé — WariTrack Security Shield'); return false; }"
    oncut="if (!window.__isInputTarget || !window.__isInputTarget(event.target)) { event.preventDefault(); return false; }"
    ondragstart="event.preventDefault(); return false;"

          <div style="width:8px;height:8px;border-radius:50%;background-color:#6366F1;animation:pwa-pulse 1.2s infinite ease-in-out;"></div>
          <span>Chargement du Cockpit WariTrack…</span>

        </style>

    </div>
    <script type="module" src="/src/main.tsx"></script>
