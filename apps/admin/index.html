<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="manifest" href="/manifest.json" />
    <title>WariTrack — Cash & Logistics Operating System</title>
    <meta name="description" content="Plateforme de pilotage e-commerce COD, gestion de trésorerie, suivi des colis et coordination des équipes." />

    <!-- Open Graph / WhatsApp Preview -->
    <meta property="og:site_name" content="WariTrack" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WariTrack — Cash & Logistics Operating System" />
    <meta property="og:description" content="Plateforme de pilotage e-commerce COD, gestion de trésorerie, suivi des colis et coordination des équipes." />
    <meta property="og:image" content="https://waritrack-admin.vercel.app/og-preview.png" />
    <meta property="og:image:secure_url" content="https://waritrack-admin.vercel.app/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <link rel="image_src" href="https://waritrack-admin.vercel.app/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WariTrack — Cash & Logistics Operating System" />
    <meta name="twitter:description" content="Plateforme de pilotage e-commerce COD, gestion de trésorerie, suivi des colis et coordination des équipes." />
    <meta name="twitter:image" content="https://waritrack-admin.vercel.app/og-preview.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <script>
      try {
        var t = localStorage.getItem("ecomcod-theme");
        var a = localStorage.getItem("ecomcod-accent") || "indigo";
        if (t === "light") {
          document.documentElement.classList.add("light");
        } else {
          document.documentElement.classList.add("dark");
        }
        document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pwa-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#07090F;color:#94a3b8;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;z-index:9999;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(99,102,241,0.4);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4l4 16 4-10 4 10 4-16"/>
            </svg>
          </div>
          <div style="font-size:20px;font-weight:800;letter-spacing:-0.03em;color:#ffffff;">
            wari<span style="color:#60A5FA;">track</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#94a3b8;background:rgba(255,255,255,0.05);padding:6px 14px;border-radius:9999px;border:1px solid rgba(255,255,255,0.08);">
          <div style="width:8px;height:8px;border-radius:50%;background-color:#6366F1;animation:pwa-pulse 1.2s infinite ease-in-out;"></div>
          <span>Chargement du Cockpit WariTrack…</span>
        </div>
        <style>
          @keyframes pwa-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
