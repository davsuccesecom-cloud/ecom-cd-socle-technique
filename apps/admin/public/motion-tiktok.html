<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WariTrack · Motion Design TikTok (Mode Blanc)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #0f141c;
  --surface-phone: #ffffff;
  --ink: #111827;
  --ink-mute: #64748b;
  --brand: #f59e0b;
  --brand-deep: #d97706;
  --emerald: #10b981;
  --sky: #0284c7;
  --border: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-app);
  color: #fff;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
}

/* En-tête de contrôle externe */
.top-bar {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 12px;
  flex-wrap: wrap;
}
.brand-tag {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-tag img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.brand-title {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -0.02em;
  color: #f8fafc;
}
.brand-sub {
  font-size: 11px;
  color: #94a3b8;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.btn {
  background: #1e293b;
  color: #f1f5f9;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
  user-select: none;
}
.btn:hover {
  background: #334155;
  border-color: #475569;
}
.btn.primary {
  background: var(--brand);
  color: #1e1303;
  border-color: var(--brand);
}
.btn.primary:hover {
  filter: brightness(1.08);
}
.btn.record {
  background: #ef4444;
  color: #ffffff;
  border-color: #ef4444;
}
.btn.record.recording {
  animation: pulse-red 1s infinite;
}
@keyframes pulse-red {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); transform: scale(1.03); }
}

/* Scène centrale : Téléphone vertical 9:16 TikTok */
.phone-wrapper {
  position: relative;
  width: 380px;
  max-width: 100%;
  aspect-ratio: 9 / 16;
  background: #000;
  border-radius: 44px;
  padding: 10px;
  box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
  display: flex;
  flex-direction: column;
}
@media (max-height: 850px) {
  .phone-wrapper { width: 330px; }
}

/* Écran intérieur */
.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 36px;
  overflow: hidden;
  background: #fbf9f5;
  display: flex;
  flex-direction: column;
}

/* Canvas haute définition */
#motionCanvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

/* Barre de progression TikTok en bas du téléphone */
.progress-rail {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(0, 0, 0, 0.1);
  z-index: 30;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--brand);
  transition: width 0.05s linear;
}

/* Navigation des scènes en bas */
.scene-nav {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 960px;
  overflow-x: auto;
  padding-bottom: 6px;
}
.scene-pill {
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s ease;
}
.scene-pill:hover, .scene-pill.active {
  background: var(--brand);
  color: #1e1303;
  border-color: var(--brand);
}

/* Toast de notification */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #ffffff;
  color: #0f172a;
  border: 1px solid #cbd5e1;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 800;
  box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 100;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand-tag">
    <div style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, #f59e0b, #d97706); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:18px;">W</div>
    <div>
      <div class="brand-title">WariTrack · Motion Design TikTok</div>
      <div class="brand-sub">60 FPS • Mode Blanc • Voix-Off IA • Synthétiseur Audio • Export MP4/WebM</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn">
      <span id="playIcon">▶</span> <span id="playLabel">Lancer la vidéo</span>
    </button>
    <button class="btn" id="voiceToggle">
      <span id="voiceIcon">🔊</span> Voix-off : Active
    </button>
    <button class="btn" id="musicToggle">

    </button>
    <button class="btn record" id="recordBtn">
      <span>⏺</span> Exporter la vidéo (.webm)
    </button>

</div>

<!-- Mockup de téléphone TikTok 9:16 -->
<div class="phone-wrapper">
  <div class="phone-screen">
    <canvas id="motionCanvas" width="1080" height="1920"></canvas>
    <div class="progress-rail">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
</div>

<!-- Sélecteur rapide des 7 scènes -->
<div class="scene-nav" id="sceneNav"></div>

<div class="toast" id="toast"></div>

<script>
// ============================================================================
// CONFIGURATION DU SCÉNARIO & DE LA VOIX-OFF (7 SCÈNES BIEN ARTICULÉES)
// ============================================================================
const SCENES = [
  {
    id: 'hook',
    title: '1. Le Défi COD',
    duration: 8.5,
    tag: 'LE CHAOS COD EN AFRIQUE',
    subtitle: 'Fini les tableurs perdus, les faux numéros et le cash qui disparaît.',
    speech: "Tu fais du e-commerce en Afrique avec paiement à la livraison ? Alors tu connais l'enfer des tableurs perdus, des faux numéros et des livreurs qui disparaissent avec ton cash."
  },
  {
    id: 'cockpit',
    title: '2. Cockpit Unifié',
    duration: 9.0,
    tag: 'DIRECTION & TRÉSORERIE',
    subtitle: 'WariTrack : votre cockpit unifié en temps réel, chiffre d’affaires et cash sécurisé.',
    speech: "Voici WariTrack. Le tout premier système d'exploitation conçu pour sécuriser votre trésorerie et piloter chaque commande à la seconde près."
  },
  {
    id: 'multichannel',
    title: '3. Shopify & Sheets',
    duration: 9.5,
    tag: 'DOUBLE MOTEUR DE FLUX',
    subtitle: 'Shopify en direct + Google Sheets pour le WhatsApp et les influenceurs.',
    speech: "Shopify pour vos boutiques, Google Sheets pour vos ventes WhatsApp et influenceurs. WariTrack détecte l'indicatif du pays et route automatiquement chaque commande vers la bonne équipe locale."
  },
  {
    id: 'closeuse',
    title: '4. App Closeuse',
    duration: 8.5,
    tag: 'CONFIRMATION RECORD',
    subtitle: 'Appel en 1-clic, relances intelligentes et primes transparentes.',
    speech: "Côté closeuse : une interface ultra-rapide. Appel en un clic, message WhatsApp pré-rempli et prime immédiate. Vos équipes confirment deux fois plus vite."
  },
  {
    id: 'livreur',
    title: '5. App Livreur & Reçu',
    duration: 9.0,
    tag: 'TERRAIN SÉCURISÉ',
    subtitle: 'Repérage quartier précis, paiement espèces et reçu 3D certifié.',
    speech: "Sur le terrain, vos livreurs gèrent leurs tournées avec repérage précis. Le client paie à la livraison, le reçu numérique est émis et le cash est verrouillé."
  },
  {
    id: 'caisse',
    title: '6. Clôture de Caisse',
    duration: 8.5,
    tag: 'ZERO FUITE DE CASH',
    subtitle: 'Rapprochement bancaire parfait : chaque franc est tracé.',
    speech: "En fin de journée : zéro trou de caisse. Vous savez exactement où est chaque franc, des mains du coursier jusqu'à votre compte bancaire."
  },
  {
    id: 'outro',
    title: '7. Dominez le COD',
    duration: 8.0,
    tag: 'WARITRACK AFRICA',
    subtitle: 'Prenez le contrôle absolu de votre e-commerce COD.',
    speech: "Ne laissez plus votre argent au hasard. Passez à WariTrack et transformez votre logistique en une véritable machine à profit."
  }
];

const TOTAL_DURATION = SCENES.reduce((acc, s) => acc + s.duration, 0);

// ============================================================================
// MOTEUR AUDIO SYNTHÉTISÉ (WEB AUDIO API)
// ============================================================================
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.isPlayingMusic = false;
    this.beatInterval = null;
    this.beatCount = 0;
  }

  init() {
    if (this.ctx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioContext();

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.18;
    this.musicGain.connect(this.ctx.destination);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.35;
    this.sfxGain.connect(this.ctx.destination);
  }

  playPing() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.12);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.45);
  }

  playCash() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    // Chime pièce de monnaie
    [1318.5, 1760, 2093, 2637].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.05);
      gain.gain.setValueAtTime(0.25, now + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.5);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now + i * 0.05);
      osc.stop(now + i * 0.05 + 0.55);
    });
  }

  playWhoosh() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.3);
  }

  startMusic() {
    if (!this.ctx || this.isPlayingMusic) return;
    this.isPlayingMusic = true;
    const bpm = 114;
    const stepTime = (60 / bpm) / 2; // croches

    this.beatInterval = setInterval(() => {
      if (!this.isPlayingMusic) return;
      const t = this.ctx.currentTime;
      this.beatCount++;

      // Kick sur les temps 1 et 3
      if (this.beatCount % 4 === 1) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 0.1);
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(g);
        g.connect(this.musicGain);
        osc.start(t);
        osc.stop(t + 0.18);
      }

      // Snare / Rimshot sur temps 2 et 4
      if (this.beatCount % 4 === 3) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, t);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.connect(g);
        g.connect(this.musicGain);
        osc.start(t);
        osc.stop(t + 0.1);
      }

      // Marimba mélodique africaine apaisée
      if (this.beatCount % 2 === 0) {
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00]; // pentatonique
        const note = notes[(this.beatCount / 2) % notes.length];
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(note * 1.5, t);
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(g);
        g.connect(this.musicGain);
        osc.start(t);
        osc.stop(t + 0.22);
      }
    }, stepTime * 1000);
  }

  stopMusic() {
    this.isPlayingMusic = false;
    if (this.beatInterval) clearInterval(this.beatInterval);
  }
}

// ============================================================================
// GESTIONNAIRE DE VOIX-OFF SYNTHÉTIQUE (SPEECH SYNTHESIS)
// ============================================================================
class VoiceManager {
  constructor() {
    this.synth = window.speechSynthesis;
    this.enabled = true;
    this.frenchVoice = null;
    this.currentUtterance = null;
    this.initVoices();
  }

  initVoices() {
    if (!this.synth) return;
    const findVoice = () => {
      const voices = this.synth.getVoices();
      // Cherche une voix française naturelle
      this.frenchVoice =
        voices.find(v => v.lang.startsWith('fr') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Henri') || v.name.includes('Denise'))) ||
        voices.find(v => v.lang.startsWith('fr')) ||
        voices[0];
    };
    findVoice();
    if (this.synth.onvoiceschanged !== undefined) {
      this.synth.onvoiceschanged = findVoice;
    }
  }

  speak(text) {
    if (!this.synth || !this.enabled) return;
    this.stop();
    const u = new SpeechSynthesisUtterance(text);
    if (this.frenchVoice) u.voice = this.frenchVoice;
    u.rate = 1.08; // Rythme punchy TikTok
    u.pitch = 1.02;
    this.currentUtterance = u;
    this.synth.speak(u);
  }

  stop() {
    if (this.synth) {
      this.synth.cancel();
    }
  }
}

// ============================================================================
// MOTEUR DE RENDU CANVAS 1080x1920 (60 FPS FLUIDE)
// ============================================================================
class MotionRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.currentTime = 0;
    this.isPlaying = false;
    this.lastFrameTime = 0;
    this.activeSceneIndex = 0;
    this.audio = new AudioEngine();
    this.voice = new VoiceManager();
    this.mediaRecorder = null;
    this.recordedChunks = [];
    this.isRecording = false;

    this.initSceneNav();
    this.bindEvents();
    this.render();
  }

  initSceneNav() {
    const nav = document.getElementById('sceneNav');
    nav.innerHTML = SCENES.map((s, i) => `
      <button class="scene-pill ${i === 0 ? 'active' : ''}" data-idx="${i}">
        ${s.title}
      </button>
    `).join('');

    nav.addEventListener('click', (e) => {
      const btn = e.target.closest('.scene-pill');
      if (btn) {
        const idx = parseInt(btn.dataset.idx, 10);
        this.jumpToScene(idx);
      }
    });
  }

  jumpToScene(idx) {
    let t = 0;
    for (let i = 0; i < idx; i++) {
      t += SCENES[i].duration;
    }
    this.currentTime = t;
    this.activeSceneIndex = idx;
    this.updateSceneNavUI();
    this.triggerSceneChange(idx);
  }

  triggerSceneChange(idx) {
    this.audio.playWhoosh();
    const s = SCENES[idx];
    if (this.voice.enabled && this.isPlaying) {
      this.voice.speak(s.speech);
    }
  }

  updateSceneNavUI() {
    document.querySelectorAll('.scene-pill').forEach((p, i) => {
      p.classList.toggle('active', i === this.activeSceneIndex);
    });
  }

  play() {
    this.audio.init();
    this.audio.startMusic();
    this.isPlaying = true;
    this.lastFrameTime = performance.now();
    document.getElementById('playIcon').textContent = '⏸';
    document.getElementById('playLabel').textContent = 'Pause';
    this.triggerSceneChange(this.activeSceneIndex);
    requestAnimationFrame((t) => this.loop(t));
  }

  pause() {
    this.isPlaying = false;
    this.audio.stopMusic();
    this.voice.stop();
    document.getElementById('playIcon').textContent = '▶';
    document.getElementById('playLabel').textContent = 'Reprendre';
  }

  togglePlay() {
    if (this.isPlaying) this.pause();
    else this.play();
  }

  loop(timestamp) {
    if (!this.isPlaying) return;
    const dt = (timestamp - this.lastFrameTime) / 1000;
    this.lastFrameTime = timestamp;

    this.currentTime += dt;
    if (this.currentTime >= TOTAL_DURATION) {
      this.currentTime = 0;
    }

    // Calcul de la scène active
    let accumulated = 0;
    let foundIdx = 0;
    for (let i = 0; i < SCENES.length; i++) {
      accumulated += SCENES[i].duration;
      if (this.currentTime < accumulated) {
        foundIdx = i;
        break;
      }
    }

    if (foundIdx !== this.activeSceneIndex) {
      this.activeSceneIndex = foundIdx;
      this.updateSceneNavUI();
      this.triggerSceneChange(foundIdx);
    }

    // Mise à jour de la barre de progression
    const pct = (this.currentTime / TOTAL_DURATION) * 100;
    document.getElementById('progressBar').style.width = `${pct}%`;

    this.render();
    requestAnimationFrame((t) => this.loop(t));
  }

  // ==========================================================================
  // DESSIN DU CANVAS (ÉLÉMENTS GRAPHIQUES MODE BLANC ULTRA-PROPRE)
  // ==========================================================================
  render() {
    const ctx = this.ctx;
    const w = 1080;
    const h = 1920;

    // 1. Fond Lumineux "Mode Blanc" épuré
    ctx.fillStyle = '#f8f6f2';
    ctx.fillRect(0, 0, w, h);

    // Grille de points subtils
    ctx.fillStyle = 'rgba(0, 0, 0, 0.035)';
    for (let x = 60; x < w; x += 60) {
      for (let y = 60; y < h; y += 60) {
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 2. Barre d'état mobile en haut
    this.drawMobileHeader(ctx, w);

    // 3. Calcul du temps relatif dans la scène active
    let sceneStartTime = 0;
    for (let i = 0; i < this.activeSceneIndex; i++) {
      sceneStartTime += SCENES[i].duration;
    }
    const sceneElapsed = this.currentTime - sceneStartTime;
    const scene = SCENES[this.activeSceneIndex];
    const progress = Math.min(1, Math.max(0, sceneElapsed / scene.duration));

    // 4. Rendu de la scène active
    ctx.save();
    switch (scene.id) {
      case 'hook':
        this.renderSceneHook(ctx, w, h, progress, sceneElapsed);
        break;
      case 'cockpit':
        this.renderSceneCockpit(ctx, w, h, progress, sceneElapsed);
        break;
      case 'multichannel':
        this.renderSceneMultiChannel(ctx, w, h, progress, sceneElapsed);
        break;
      case 'closeuse':
        this.renderSceneCloseuse(ctx, w, h, progress, sceneElapsed);
        break;
      case 'livreur':
        this.renderSceneLivreur(ctx, w, h, progress, sceneElapsed);
        break;
      case 'caisse':
        this.renderSceneCaisse(ctx, w, h, progress, sceneElapsed);
        break;
      case 'outro':
        this.renderSceneOutro(ctx, w, h, progress, sceneElapsed);
        break;
    }
    ctx.restore();

    // 5. Interface Overlay TikTok (Sous-titres animés, boutons d'action verticaux, disque musical)
    this.drawTikTokOverlay(ctx, w, h, scene, progress);
  }

  drawMobileHeader(ctx, w) {
    ctx.save();
    // Heure & Encoche
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 36px "Plus Jakarta Sans"';
    ctx.fillText('09:41', 75, 110);

    // Dynamic Island / Encoche
    ctx.fillStyle = '#0f172a';
    this.roundRect(ctx, (w - 240) / 2, 60, 240, 60, 30);
    ctx.fill();

    // WariTrack Logo Badge compact
    ctx.fillStyle = '#ffffff';
    this.roundRect(ctx, 75, 160, w - 150, 96, 24);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#e2e8f0';
    ctx.stroke();

    // Logo W
    ctx.fillStyle = '#f59e0b';
    this.roundRect(ctx, 95, 178, 60, 60, 16);
    ctx.fill();
    ctx.fillStyle = '#1e1b18';
    ctx.font = '900 34px "Plus Jakarta Sans"';
    ctx.fillText('W', 110, 222);

    ctx.fillStyle = '#0f172a';
    ctx.font = '800 34px "Plus Jakarta Sans"';
    ctx.fillText('WariTrack', 175, 212);

    ctx.fillStyle = '#64748b';
    ctx.font = '600 20px "Plus Jakarta Sans"';
    ctx.fillText('Cash & Logistics Operating System', 175, 242);

    // Badge scène en cours
    ctx.fillStyle = '#f1f5f9';
    this.roundRect(ctx, w - 245, 185, 125, 46, 23);
    ctx.fill();

  // Utilitaire rectangle à coins arrondis
  roundRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  // ==========================================================================
  // ENREGISTREUR VIDÉO MEDIARECORDER (EXPORT MP4 / WEBM)
  // ==========================================================================
  startRecording() {
    if (this.isRecording) return;
    this.audio.init();
    const stream = this.canvas.captureStream(60); // 60 FPS
    this.recordedChunks = [];

    let mimeType = 'video/webm;codecs=vp9';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'video/webm';
    }

    this.mediaRecorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: 8000000 // Haute qualité 8 Mbps
    });

    this.mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) this.recordedChunks.push(e.data);
    };

    this.mediaRecorder.onstop = () => {
      const blob = new Blob(this.recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `waritrack-motion-tiktok-${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Vidéo exportée avec succès !");
      document.getElementById('recordBtn').classList.remove('recording');
      document.getElementById('recordBtn').innerHTML = '<span>⏺</span> Exporter la vidéo (.webm)';
      this.isRecording = false;
    };

    this.mediaRecorder.start();
    this.isRecording = true;
    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('recordBtn').innerHTML = '<span>⏹</span> Enregistrement en cours…';
    showToast("Enregistrement 60 FPS démarré…");

    // Redémarre la lecture depuis le début pour un enregistrement complet
    this.currentTime = 0;
    this.activeSceneIndex = 0;
    this.play();
  }

  stopRecording() {
    if (this.mediaRecorder && this.isRecording) {
      this.mediaRecorder.stop();
      this.pause();
    }
  }

  bindEvents() {
    document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());

    document.getElementById('voiceToggle').addEventListener('click', () => {
      this.voice.enabled = !this.voice.enabled;
      document.getElementById('voiceIcon').textContent = this.voice.enabled ? '🔊' : '🔇';
      document.getElementById('voiceToggle').innerHTML = `<span id="voiceIcon">${this.voice.enabled ? '🔊' : '🔇'}</span> Voix-off : ${this.voice.enabled ? 'Active' : 'Désactivée'}`;
      if (!this.voice.enabled) this.voice.stop();
      showToast(`Voix-off ${this.voice.enabled ? 'activée' : 'désactivée'}`);
    });

    document.getElementById('musicToggle').addEventListener('click', () => {
      this.audio.isPlayingMusic = !this.audio.isPlayingMusic;
      if (this.audio.isPlayingMusic) {
        this.audio.init();
        this.audio.startMusic();
      } else {
        this.audio.stopMusic();
      }
      document.getElementById('musicIcon').textContent = this.audio.isPlayingMusic ? '🎵' : '🔇';
      document.getElementById('musicToggle').innerHTML = `<span id="musicIcon">${this.audio.isPlayingMusic ? '🎵' : '🔇'}</span> Beat : ${this.audio.isPlayingMusic ? 'Actif' : 'Coupé'}`;
      showToast(`Beat musical ${this.audio.isPlayingMusic ? 'activé' : 'coupé'}`);
    });

    document.getElementById('recordBtn').addEventListener('click', () => {
      if (this.isRecording) {
        this.stopRecording();
      } else {
        this.startRecording();
      }
    });
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
