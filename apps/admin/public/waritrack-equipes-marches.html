<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WariTrack — Équipes & Marchés</title>
<style>
:root{--bg:#f3f4fb;--sf:#fff;--ink:#14162b;--mut:#6b7090;--line:#e3e5f3;--br:#4f46e5;--br2:#7c3aed;--ok:#10b981;--wn:#f59e0b;--glow:rgba(79,70,229,.12);--land:#e5e8f7;--landh:#d2d6f8;--landhh:#bfc5f5;--land2:#f7f8ff;--ln:#fff;--rg:#b4b9de;--sh:0 10px 30px -12px rgba(40,40,100,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1c;--sf:#141730;--ink:#eef0ff;--mut:#8d93bb;--line:#242849;--glow:rgba(124,92,255,.22);--land:#1b1f40;--landh:#2b3070;--landhh:#3a4090;--land2:#232860;--ln:#0b0d1c;--rg:#3a4075;--sh:0 10px 30px -12px #000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d1c;--sf:#141730;--ink:#eef0ff;--mut:#8d93bb;--line:#242849;--glow:rgba(124,92,255,.22);--land:#1b1f40;--landh:#2b3070;--landhh:#3a4090;--land2:#232860;--ln:#0b0d1c;--rg:#3a4075;--sh:0 10px 30px -12px #000;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}.sub{color:var(--mut);margin-top:2px}
.kp{display:flex;gap:10px;flex-wrap:wrap}.kp div{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:92px}
.kp b{display:block;font-size:20px;letter-spacing:-.02em}.kp span{font-size:12px;color:var(--mut)}
.rail{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.tab{flex:none;display:flex;gap:8px;align-items:center;background:var(--sf);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:600;transition:.2s}
.tab:hover{border-color:var(--br);transform:translateY(-1px)}.tab.on{border-color:var(--br);background:var(--glow);box-shadow:0 0 0 3px var(--glow)}
.tab .f{font-size:18px}.tab small{color:var(--mut);font-weight:600}.tab s{width:8px;height:8px;border-radius:50%;background:var(--ok)}.tab s.w{background:var(--wn)}
.sep{flex:1;min-width:8px}
.pri{flex:none;background:linear-gradient(135deg,var(--br),var(--br2));color:#fff;border:0;border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:0 10px 22px -10px var(--br);position:sticky;right:0}
.pri:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
@media(max-width:1020px){.grid{grid-template-columns:1fr}aside{position:static!important;max-height:none!important}}
.stage{position:relative;aspect-ratio:1000/700;background:radial-gradient(70% 60% at 50% 45%,var(--glow),transparent 72%),var(--sf);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
#g{transform-origin:0 0;transition:transform 1.1s cubic-bezier(.65,0,.25,1)}
.ct{fill:var(--land);stroke:var(--ln);stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .6s,opacity .6s}
.ct.has{fill:var(--landh);cursor:pointer}.ct.has:hover{fill:var(--landhh)}.ct.sel{fill:var(--land2)}.ct.dim{opacity:.3;pointer-events:none}
.rg{fill:transparent;stroke:var(--rg);stroke-width:.9;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .5s}
.rg.on{fill:var(--br)}.rg:hover{fill:var(--br);fill-opacity:.38!important}.rg.z{stroke:var(--br);stroke-width:2.4}
.fx{fill:none;stroke:var(--br2);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:3 9;stroke-linecap:round;animation:dash 1s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-12}}
#ov2{position:absolute;inset:0;pointer-events:none}#ov2>*{pointer-events:auto}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:var(--sf);border:1.5px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;box-shadow:0 6px 16px -6px rgba(30,30,90,.5);z-index:3;transition:transform .2s}
.pin:hover{transform:translate(-50%,-50%) scale(1.08)}.pin .fl{font-size:20px;width:30px;height:30px;display:grid;place-items:center;background:var(--bg);border-radius:50%}
.pin b{font-size:12px;white-space:nowrap}.pin i{font-style:normal;font-size:11px;font-weight:700;background:var(--br);color:#fff;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;position:absolute;top:-6px;right:-4px;padding:0 5px}
.cty{position:absolute;transform:translate(-6px,-50%);display:flex;align-items:center;gap:5px;background:none;border:0;padding:0;z-index:3}
.cty s{width:12px;height:12px;border-radius:50%;background:var(--mut);border:2.5px solid var(--sf);flex:none}
.cty.a s{background:var(--br);box-shadow:0 0 0 5px var(--glow)}
.cty span{font-size:11.5px;font-weight:600;background:var(--sf);padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.cty i{font-style:normal;font-size:11px;font-weight:700;background:var(--br);color:#fff;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;margin-left:-2px}
.cty:hover span{border-color:var(--br)}
.rip{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--ok);animation:rp 1.7s ease-out forwards;pointer-events:none!important;z-index:2}
@keyframes rp{to{transform:scale(5);opacity:0}}
.chip{position:absolute;left:14px;top:14px;z-index:7;display:flex;gap:8px;align-items:center}
.chip button,.chip span{background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;box-shadow:0 4px 12px -6px rgba(30,30,90,.4)}
.chip button:hover{border-color:var(--br);color:var(--br)}
.mi{position:absolute;right:14px;bottom:14px;width:124px;height:124px;z-index:7;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--sh);display:none;cursor:pointer}
.mi svg{width:100%;height:100%}.ci{fill:var(--land)}.ci.on{fill:var(--br)}
.leg{position:absolute;left:14px;bottom:12px;z-index:3;font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.leg u{text-decoration:none;display:flex;align-items:center;gap:5px}.leg u::before{content:"";width:14px;height:8px;border-radius:3px;background:var(--br);opacity:.5}
.leg u.l::before{height:0;border-top:2px dashed var(--br2);background:none;opacity:1}
aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}.card+.card{margin-top:12px}
.th{display:flex;gap:12px;align-items:center}.th .big{font-size:32px;width:54px;height:54px;display:grid;place-items:center;background:var(--bg);border-radius:16px}
.th h2{margin:0;font-size:18px}.th p{margin:0;color:var(--mut);font-size:13px}
.bd{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:rgba(16,185,129,.14);color:var(--ok)}.bd.w{background:rgba(245,158,11,.16);color:var(--wn)}.bd.b{background:var(--glow);color:var(--br)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.k3 div{background:var(--bg);border-radius:14px;padding:10px}.k3 b{display:block;font-size:17px}.k3 span{font-size:11.5px;color:var(--mut)}
h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.note{font-size:12.5px;color:var(--mut);margin:0 0 10px}
.live{color:var(--ok);display:inline-flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-weight:700}.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.2s infinite}
@keyframes pl{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.8)}}
.zr{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:8px 11px;margin-top:6px}
.zr:hover,.zr.on{border-color:var(--br)}.zr div{display:flex;justify-content:space-between;font-weight:600;font-size:13px}.zr small{color:var(--mut);font-weight:600}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--br),var(--br2));border-radius:9px}
.zd{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}.zd p{margin:2px 0 8px;color:var(--mut)}
.sp{width:100%;height:52px;display:block}
.ev{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}.ev li{display:flex;gap:9px;align-items:center;font-size:13px;padding:7px 10px;background:var(--bg);border-radius:12px;animation:in .5s}
.ev li s{width:8px;height:8px;border-radius:50%;flex:none}.ev li em{margin-left:auto;font-style:normal;color:var(--mut);font-size:11.5px;flex:none}@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.cn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.cn:first-of-type{border:0}.cn code{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:6px 12px;font-weight:600;font-size:12.5px}.btn:hover{border-color:var(--br);color:var(--br)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mc{display:flex;gap:9px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:9px 10px;transition:.2s}.mc:hover{border-color:var(--br);transform:translateY(-2px)}
.mc .f{font-size:22px}.mc b{display:block;font-size:13px;line-height:1.2}.mc span{font-size:11.5px;color:var(--mut)}
.ovl{position:fixed;inset:0;background:rgba(8,9,25,.55);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:16px}.ovl.s{display:grid}
.md{background:var(--sf);border-radius:22px;padding:22px;width:min(440px,100%);border:1px solid var(--line);box-shadow:0 30px 60px -20px #000}
.md h2{margin:0 0 6px}.md label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.md input,.md select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.md input:focus,.md select:focus{outline:2px solid var(--br)}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:60;pointer-events:none}#toast.s{opacity:1;transform:translate(-50%,0)}
.ph{text-align:center;color:var(--mut);padding:8px 0 4px}.ph .big{font-size:40px}
@media(max-width:600px){.pin b{display:none}.pin{padding:3px}.cty span{font-size:10px}.mi{width:84px;height:84px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Équipes & Marchés</h1><div class="sub">Choisissez une équipe, suivez ses zones et son trafic d’opérations en direct</div></div>
  <div class="kp" id="kp"></div>
</header>
<div class="rail" id="rail"></div>
<div class="grid">
  <div class="stage" id="stage">
    <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-label="Carte de l’Afrique"><g id="g"><g id="land"></g><g id="reg"></g><g id="flux"></g></g></svg>
    <div id="ov2"></div>
    <div class="chip" id="chip"></div>
    <div class="mi" id="mi" title="Retour à l’Afrique"><svg viewBox="160 0 680 700" id="mis"></svg></div>
    <div class="leg" id="leg"></div>
  </div>
  <aside id="side"></aside>
</div>
</div>
<div class="ovl" id="ov"><div class="md">
  <h2>Créer une équipe</h2><div class="sub">Le flux sera configuré par localisation des commandes.</div>
  <label>Nom de l’équipe</label><input id="fn" placeholder="Ex. Équipe Sénégal">
  <label>Pays</label><select id="fc"></select>
  <label>Devise</label><input id="fd" readonly>
  <label>Source des commandes</label><select id="fs"><option value="shopify">Shopify (temps réel)</option><option value="sheets">Google Sheets</option><option value="">Je configure plus tard</option></select>
  <div class="ma"><button class="btn" id="fx">Annuler</button><button class="pri" id="fk" style="position:static">Créer l’équipe</button></div>
</div></div>
<div id="toast"></div>

return w.map(o=>({ri:o.ri,sh:o.w/sm,o:Math.round(t.orders*o.w/sm),dl:12+(s+o.ri*5)%25})).sort((a,b)=>b.o-a.o||b.sh-a.sh)}
function mk(t,d){const a=C[t.cc].a,cs=GEO.ct[a].filter(c=>t.z.includes(c[3]));if(!cs.length)return null;const c=cs[Math.floor(Math.random()*cs.length)],n=1000+Math.floor(Math.random()*900),r=Math.random(),cu=C[t.cc].cur;
const o=r<.4?["var(--br)",`Nouvelle commande #${n} · ${c[0]}`]:r<.65?["var(--ok)",`Livrée · ${c[0]} · ${fmt(5000+Math.floor(Math.random()*20)*1000)} ${cu}`]:r<.85?["var(--wn)",`Client confirmé par appel · ${c[0]}`]:["var(--br2)",`Cash remis à la caisse · ${c[0]}`];
return{c:o[0],x:o[1],d,px:c[1],py:c[2]}}
function seedFeed(t){feeds[t.id]=[];if(!t.orders)return;for(let i=0;i<4;i++){const e=mk(t,new Date(Date.now()-(i*7+2)*60000));if(e)feeds[t.id].push(e)}}
teams.forEach(seedFeed);
const evHTML=t=>(feeds[t.id]||[]).slice(0,5).map(e=>`<li><s style="background:${e.c}"></s>${esc(e.x)}<em>${hhmm(e.d)}</em></li>`).join("")||'<li>Aucune activité pour le moment</li>';
function spark(t){const s=seed(t.id),v=[];for(let i=0;i<12;i++)v.push(t.orders?Math.max(.5,3+s%4+2.5*Math.sin(i*.8+s)+i/3):.4);const m=Math.max(...v),l=v.map((y,i)=>(i?"L":"M")+(i*100/11).toFixed(1)+" "+(30-y/m*26).toFixed(1)).join("");
return `<svg class="sp" viewBox="0 0 100 32" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--br)" stop-opacity=".35"/><stop offset="1" stop-color="var(--br)" stop-opacity="0"/></linearGradient></defs><path d="${l}L100 32L0 32Z" fill="url(#sg)"/><path d="${l}" fill="none" stroke="var(--br)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
const badge=t=>t.src==="shopify"?'<span class="bd">● Shopify temps réel</span>':t.src==="sheets"?'<span class="bd b">Google Sheets</span>':'<span class="bd w">À configurer</span>';
const mc=t=>`<button class="mc" data-id="${t.id}"><span class="f">${C[t.cc].f}</span><div><b>${esc(t.name)}</b><span>${C[t.cc].n} · ${t.orders} cmd</span></div></button>`;
$("land").innerHTML=Object.entries(GEO.w).map(([a,d])=>`<path class="ct" data-a="${a}" d="${d}"/>`).join("");
$("mis").innerHTML=Object.entries(GEO.w).map(([a,d])=>`<path class="ci" data-a="${a}" d="${d}"/>`).join("");
function view(){
const t=cur(),c=t&&C[t.cc];let k=1,tx=0,ty=0;if(c){k=c.k;tx=W/2-k*c.cx;ty=H/2-k*c.cy}V={k,tx,ty};
$("g").style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
const has=new Set(teams.map(x=>C[x.cc].a));
document.querySelectorAll(".ct").forEach(p=>{const a=p.dataset.a,own=c&&c.a===a;p.classList.toggle("has",has.has(a)&&!c);p.classList.toggle("sel",!!own);p.classList.toggle("dim",!!c&&!own)});
document.querySelectorAll(".ci").forEach(p=>p.classList.toggle("on",!!c&&p.dataset.a===c.a));
let ov="",zi=[];$("reg").innerHTML="";$("flux").innerHTML="";
if(c){zi=zinfo(t);const on=new Map(zi.map(z=>[z.ri,z])),ct=GEO.ct[c.a],h=ct[0];
$("reg").innerHTML=GEO.r[c.a].map((r,i)=>{const z=on.get(i);return`<path class="rg${z?" on":""}${zs===i?" z":""}" data-ri="${i}" d="${r.d}"${z?` style="fill-opacity:${Math.min(.6,.16+z.sh*1.4).toFixed(2)}"`:""}><title>${esc(r.n)}</title></path>`}).join("");
$("flux").innerHTML=zi.filter(z=>z.ri!==h[3]).map(z=>{const[x,y]=anc(c.a,z.ri),dx=h[1]-x,dy=h[2]-y;return`<path class="fx" d="M${x} ${y}Q${(x+h[1])/2-dy*.2} ${(y+h[2])/2+dx*.2} ${h[1]} ${h[2]}"/>`}).join("");
const first=new Set();ct.forEach(x=>{const z=on.get(x[3]);let b="";if(z&&!first.has(x[3])){first.add(x[3]);b=`<i>${z.o}</i>`}ov+=`<button class="cty${z?" a":""}" data-ri="${x[3]}" style="${pos(x[1],x[2])}"><s></s><span>${esc(x[0])}</span>${b}</button>`})}
else{const by={};teams.forEach(x=>(by[x.cc]=by[x.cc]||[]).push(x));for(const cc in by){const q=C[cc];ov+=`<button class="pin" data-id="${by[cc][0].id}" style="${pos(q.cx,q.cy)}"><span class="fl">${q.f}</span><b>${q.n}</b>${by[cc].length>1?`<i>${by[cc].length}</i>`:""}</button>`}}
$("ov2").innerHTML=ov;
$("mi").style.display=c?"block":"none";
$("chip").innerHTML=t?`<button id="back">← Afrique</button><span>${c.f} ${c.n}</span>`:`<span>🌍 Afrique · ${new Set(teams.map(x=>x.cc)).size} pays</span>`;
if(t)$("back").onclick=()=>pick(null);
$("leg").innerHTML=t?'<u>Zone dans le flux</u><u class="l">Acheminement vers le hub</u><span>Touchez une zone pour l’ajouter ou la retirer</span>':'';
const tot=teams.reduce((a,x)=>a+x.orders,0);
$("kp").innerHTML=`<div><b>${teams.length}</b><span>Équipes</span></div><div><b>${new Set(teams.map(x=>x.cc)).size}</b><span>Pays</span></div><div><b>${tot}</b><span>Commandes du jour</span></div>`;
$("rail").innerHTML=`<button class="tab${t?"":" on"}" data-id=""><span class="f">🌍</span>Toute l’Afrique</button>`+teams.map(x=>`<button class="tab${x.id===sel?" on":""}" data-id="${x.id}"><span class="f">${C[x.cc].f}</span>${esc(x.name)}<small>${x.orders}</small><s class="${x.src?"":"w"}"></s></button>`).join("")+`<span class="sep"></span><button class="pri" id="new">＋ Nouvelle équipe</button>`;
side(t,c,zi);wire()}
function side(t,c,zi){let h="";
if(!t){const by={};teams.forEach(x=>(by[x.cc]=by[x.cc]||[]).push(x));
h=`<div class="card"><div class="ph"><div class="big">🌍</div><h2 style="margin:6px 0">Choisissez une équipe</h2><p class="note">Sélectionnez une équipe en haut ou touchez un pays : la carte zoome sur ses zones et affiche son trafic.</p></div></div><div class="card"><h3>Marchés actifs</h3>${Object.keys(by).map(cc=>`<button class="zr" data-id="${by[cc][0].id}"><div><span>${C[cc].f} ${C[cc].n}</span><small>${by[cc].length} équipe${by[cc].length>1?"s":""} · ${by[cc].reduce((a,x)=>a+x.orders,0)} cmd</small></div></button>`).join("")}</div>`}
else{const ct=GEO.ct[c.a],sim=teams.filter(x=>x.cc===t.cc&&x.id!==t.id),rg=GEO.r[c.a];
const zr=zi.slice(0,6).map(z=>`<button class="zr${zs===z.ri?" on":""}" data-ri="${z.ri}"><div><span>${esc(rg[z.ri].n)}</span><small>${z.o} cmd · ~${z.dl} min</small></div><div class="bar"><u style="width:${Math.round(z.sh*100)}%"></u></div></button>`).join("");
let zd="";if(zs!=null){const act=t.z.includes(zs),cs=ct.filter(x=>x[3]===zs).map(x=>x[0]).join(", ");zd=`<div class="zd"><b>${esc(rg[zs].n)}</b><p>${cs?"Villes : "+esc(cs):"Aucune ville repérée — la localisation Shopify des commandes décidera."}</p><button class="btn" data-tz="${zs}">${act?"Retirer cette zone du flux":"Ajouter cette zone au flux"}</button></div>`}
h=`<div class="card"><div class="th"><div class="big">${c.f}</div><div><h2>${esc(t.name)}</h2><p>${c.n} · Devise ${c.cur}</p></div></div><div class="row">${badge(t)}${t.sheets?`<span class="bd b">${t.sheets} tableur${t.sheets>1?"s":""}</span>`:""}</div>
<div class="k3"><div><b>${t.orders}</b><span>Commandes</span></div><div><b>${t.dl}%</b><span>Livrées</span></div><div><b>${fmt(t.cash)}</b><span>${c.cur} encaissés</span></div></div></div>
<div class="card"><h3>Flux par localisation <span>${zi.length} zone${zi.length>1?"s":""}</span></h3><p class="note">Chaque commande est localisée à sa création, rattachée à une zone, puis acheminée vers l’équipe terrain de cette zone.</p>${zr||'<p class="note">Aucune zone active : touchez une région sur la carte pour démarrer le flux.</p>'}${zi.length>6?`<p class="note" style="margin-top:8px">+ ${zi.length-6} autres zones</p>`:""}${zd}</div>
<div class="card"><h3>Trafic d’opérations <span class="live">En direct</span></h3>${spark(t)}<ul class="ev" id="ev">${evHTML(t)}</ul></div>
<div class="card"><h3>Équipes du même pays</h3>${sim.length?`<div class="mini">${sim.map(mc).join("")}</div>`:`<p class="note">Aucune autre équipe en ${c.n}.</p>`}</div>
<div class="card"><h3>Connexions</h3><div class="cn"><span>Shopify</span>${t.src==="shopify"?'<span class="bd">Actif</span>':'<button class="btn" data-a="x">Connecter</button>'}</div><div class="cn"><span>Google Sheets</span>${t.src==="shopify"?'<span class="bd w">En veille</span>':'<button class="btn" data-a="x">Connecter un sheet</button>'}</div><div class="cn"><code>meta-capi-app@appspot.gserviceaccount.com</code><button class="btn" data-a="copy">Copier</button></div></div>`}
$("side").innerHTML=h}
function pick(id){sel=id||null;zs=null;view()}
function wire(){document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>pick(b.dataset.id));
document.querySelectorAll("#side [data-ri]").forEach(b=>b.onclick=()=>{zs=+b.dataset.ri;view()});
document.querySelectorAll("[data-tz]").forEach(b=>b.onclick=()=>{const t=cur(),r=+b.dataset.tz,i=t.z.indexOf(r);i>=0?t.z.splice(i,1):t.z.push(r);view();toast(i>=0?"Zone retirée du flux":"Zone ajoutée au flux")});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(b.dataset.a==="copy"){try{navigator.clipboard.writeText("meta-capi-app@appspot.gserviceaccount.com")}catch(e){}toast("Adresse du robot copiée")}else toast("Assistant de connexion à brancher")});
$("new").onclick=()=>openM(cur()?cur().cc:"SN")}
$("g").onclick=e=>{const r=e.target.closest("[data-ri]"),p=e.target.closest(".ct.has");if(r){zs=+r.dataset.ri;view()}else if(p){const t=teams.find(x=>C[x.cc].a===p.dataset.a);if(t)pick(t.id)}};
$("ov2").onclick=e=>{const b=e.target.closest(".cty");if(b){zs=+b.dataset.ri;view()}};
$("mi").onclick=()=>pick(null);
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("s");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("s"),2200)}
const fc=$("fc");fc.innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v.f} ${v.n}</option>`).join("");
const setCur=()=>$("fd").value=C[fc.value].cur;fc.onchange=setCur;
function openM(cc){fc.value=cc;setCur();$("ov").classList.add("s");setTimeout(()=>$("fn").focus(),50)}
const closeM=()=>$("ov").classList.remove("s");
$("fx").onclick=closeM;$("ov").onclick=e=>{if(e.target.id==="ov")closeM()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
$("fk").onclick=()=>{const n=$("fn").value.trim();if(!n){$("fn").focus();return}const cc=fc.value;
const t={id:"t"+Date.now(),name:n,cc,src:$("fs").value,sheets:0,orders:0,dl:0,cash:0,z:[GEO.ct[C[cc].a][0][3]]};teams.push(t);feeds[t.id]=[];$("fn").value="";closeM();pick(t.id);toast("Équipe « "+n+" » créée")};
setInterval(()=>{const t=cur();if(!t||!t.orders)return;const e=mk(t,new Date());if(!e)return;feeds[t.id].unshift(e);feeds[t.id].length=Math.min(feeds[t.id].length,8);
const l=$("ev");if(l)l.innerHTML=evHTML(t);const r=document.createElement("span");r.className="rip";r.style.cssText=pos(e.px,e.py);$("ov2").appendChild(r);setTimeout(()=>r.remove(),1700)},3500);
view();
</script>
</body>
</html>
