    <title>WariTrack — Espace Closeuse</title>
    <meta name="description" content="Espace dédié aux téléconseillères pour la confirmation rapide et le suivi des commandes." />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      (function() {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) {
          try {
            var u = new URL(window.location.href);
            if (!u.searchParams.has('standalone')) {
              u.searchParams.set('standalone', 'true');
              window.history.replaceState(null, '', u.toString());
            }
          } catch (e) {}
        }
        function sendIdentity() {
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              type: 'WARITRACK_CLIENT_IDENTITY',
              isStandalone: isStandalone,
              href: window.location.href
            });
          }
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'CHECK_STANDALONE') {
              if (e.ports && e.ports[0]) {
                e.ports[0].postMessage({ isStandalone: isStandalone });
              }
            }
          });
          sendIdentity();
          navigator.serviceWorker.ready.then(sendIdentity);
        }
      })();
    </script>
